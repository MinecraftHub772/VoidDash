name: Build VoidDash

on:
  push:
    branches:
      - main
      - master

  pull_request:

  workflow_dispatch:

jobs:
  build:
    name: Build Geode Mod
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build VoidDash
        uses: geode-sdk/build-geode-mod@main
        with:
          combine: true

      - name: Upload Geode files
        uses: actions/upload-artifact@v4
        with:
          name: VoidDash-Geode
          path: build/*.geode
          if-no-files-found: warn
